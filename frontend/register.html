<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account | Libraria</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="style.css">

</head>


<body class="auth-page">


<a href="index.html" class="auth-brand brand">

    <span class="brand-mark">
        <i class="fa-solid fa-book-open"></i>
    </span>

    LIBRARIA

</a>


<main class="auth-shell">


<section class="auth-art">

    <div class="auth-art-content">

        <div class="eyebrow">
            JOIN LIBRARIA
        </div>

        <h1>
            Make every
            <br>
            <em>chapter count.</em>
        </h1>

        <p>
            Create your account and discover a cleaner,
            smarter way to manage your library experience.
        </p>

    </div>

</section>


<section class="auth-form-wrap">

<form class="auth-form" id="registerForm">


<div class="mobile-brand">

    <span class="brand-mark">
        <i class="fa-solid fa-book-open"></i>
    </span>

</div>


<h2>
    Create your account
</h2>

<p>
    Start your smarter library experience.
</p>


<label>

    Full name

    <input
        type="text"
        id="name"
        placeholder="Your full name"
        required>

</label>


<label>

    Email address

    <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required>

</label>


<label>

    Password

    <div class="password-field">

        <input
            type="password"
            id="password"
            placeholder="Create a password"
            required>

        <button
            type="button"
            class="password-toggle">

            <i class="fa-regular fa-eye"></i>

        </button>

    </div>

</label>


<label class="checkbox terms">

    <input
        type="checkbox"
        required>

    <span>
        I agree to the Terms and Privacy Policy
    </span>

</label>


<button
    class="btn btn-primary submit-btn"
    type="submit">

    Create Account

    <i class="fa-solid fa-arrow-right"></i>

</button>


<div class="divider">

    <span>
        OR CONTINUE WITH
    </span>

</div>


<button
    type="button"
    class="social-btn">

    <i class="fa-brands fa-google"></i>

    Continue with Google

</button>


<p class="switch-auth">

    Already have an account?

    <a href="login.html">
        Sign in
    </a>

</p>


</form>

</section>

</main>


<script src="app.js"></script>

</body>
</html>
